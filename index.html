<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>kabu-tool-drive | アプリについて</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:700px;margin:48px auto;padding:0 20px;line-height:1.85;color:#222}h1{font-size:1.65rem}a{color:#1456ab}</style></head><body><h1>kabu-tool-drive</h1><p>kabu-tool-drive は、個人が利用する株式分析ツールの実行結果と取引記録を、本人のGoogleドライブ内で読み書きするための補助アプリです。</p><p>本人の認証を得て、Google Drive APIを通じて株ツール用ファイルの読み取りと更新を行います。株ツールの処理は非公開のGitHub Actions環境で実行します。このページから取引やログインはできません。</p><p>株式の売買推奨や投資助言を提供する公開サービスではありません。</p><p><a href="privacy.html">プライバシーポリシー</a></p></body></html>
